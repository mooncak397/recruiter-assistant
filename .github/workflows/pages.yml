# Publishes web/ to GitHub Pages. Works only after Pages is set to "GitHub Actions" in the repo settings (docs/DEPLOY.md).
name: Pages

on:
  push:
    branches: [main]
    paths: ['web/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # the page needs no build step (ADR-004); leave out the local fake API and the folder README
      - run: cp -r web _site && rm -rf _site/dev _site/README.md
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5

[project]
name = "recruiter-assistant"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.5,<2",
    "langgraph>=1.2,<2",
    "langchain-google-genai>=4.5,<5",
    "python-dotenv>=1.2",
]

[dependency-groups]
dev = ["pytest>=9", "pyyaml>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
